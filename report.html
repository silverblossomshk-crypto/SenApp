<main class="shell interior">
  <div class="page-heading"><h1>評估報告示例</h1><p>以理解與跟隨指令為例，看看報告怎樣呈現任務表現和可嘗試的支援。</p></div>
  <section class="section report-preview full-report" aria-labelledby="example-title">
    <h2 id="example-title">理解與跟隨指令 <small>示例</small></h2>
    <dl>
    <div><dt>評估項目</dt><dd>理解與跟隨指令。</dd></div>
    <div><dt>評估任務</dt><dd>比較孩子聽到口頭指令，以及看到圖示輔助時，完成相近的兩步任務的表現。</dd></div>
    <div><dt>任務表現</dt><dd>口頭提示時漏掉第二步。加入圖示後完成兩步。</dd></div>
    <div><dt>可以試的支援</dt><dd>把常做的事情畫成幾張圖卡，每完成一步便翻到下一張。</dd></div>
  </dl>
  <p class="note">本例使用虛構資料，展示單一評估項目的報告格式。</p>
  </section>
