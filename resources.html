  <div class="page-heading"><h1>家長資源</h1><p>從日常留意到的情況出發，了解孩子的發展與學習需要。</p></div>
  <section class="section resources" id="resources" aria-labelledby="resources-title">

    <div class="topics">
      <details><summary>說話與溝通</summary><p>留意孩子在甚麼情境較容易理解指示，例如面對面說話、加上圖示或一次只說一個步驟。</p></details>
      <details><summary>專注與做事</summary><p>記下孩子在哪些活動較容易投入，以及環境或活動長度改變時有甚麼分別。</p></details>
      <details><summary>閱讀與書寫</summary><p>留意孩子在哪個環節需要幫忙，例如認字、朗讀、理解內容或寫字。</p></details>
    </div>
